name: check-links
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check links (report only)
        run: |
          set +e
          npm run check-links | tee link-report.txt
          code=${PIPESTATUS[0]}
          {
            echo '## Link check report'
            echo ''
            echo '```'
            cat link-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
